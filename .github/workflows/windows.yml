name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'RetroPortingToolKit/workbench-studio' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare pinned SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content DEPENDENCIES.json -Raw | ConvertFrom-Json
          $sdk = $lock.native_sdk
          New-Item -ItemType Directory .tools -Force | Out-Null
          $archive = Join-Path $PWD '.tools/sdk.zip'
          $url = $sdk.repository + '/releases/download/' + $sdk.tag + '/' + $sdk.file
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sdk.sha256) { throw 'SDK checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath .tools/sdk
          $metadata = Get-ChildItem .tools/sdk -Recurse -Filter retcomm-toolchain.json | Select-Object -First 1
          if (-not $metadata) { throw 'SDK metadata missing' }
          $root = $metadata.Directory.FullName
          "STUDIO_SDK=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $temp = Join-Path $PWD 'build/tmp'
          New-Item -ItemType Directory $temp -Force | Out-Null
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'PYTHONDONTWRITEBYTECODE=1' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Media-free controller tests
        run: |
          & "$env:STUDIO_SDK/python/python.exe" -X utf8 -B scripts/run_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build native frontend
        run: '& ./scripts/build.ps1 -ToolchainRoot $env:STUDIO_SDK'
      - name: Package clean Windows distribution
        run: |
          & "$env:STUDIO_SDK/python/python.exe" -X utf8 -B scripts/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare software OpenGL test fixture
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = (Get-Content DEPENDENCIES.json -Raw | ConvertFrom-Json).ci_graphics_fixture
          Invoke-WebRequest -Uri $fixture.url -OutFile .tools/graphics.7z
          if ((Get-FileHash .tools/graphics.7z -Algorithm SHA256).Hash.ToLowerInvariant() -ne $fixture.sha256) { throw 'Graphics fixture checksum mismatch' }
          & 7z x .tools/graphics.7z '-o.tools/graphics' -y | Out-Null
          if ($LASTEXITCODE) { throw 'Graphics fixture extraction failed' }
          $gl = Get-ChildItem .tools/graphics -Recurse -Filter opengl32.dll | Where-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            [BitConverter]::ToUInt16($bytes, $pe + 4) -eq 0x8664
          } | Select-Object -First 1
          if (-not $gl) { throw 'Graphics fixture has no Windows x64 OpenGL provider' }
          "STUDIO_TEST_OPENGL_DIR=$($gl.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'GALLIUM_DRIVER=llvmpipe' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify extracted package and runtime
        run: |
          & "$env:STUDIO_SDK/python/python.exe" -X utf8 -B scripts/verify_package.py build/package/WorkbenchStudio-Windows-preview.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload Windows preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WorkbenchStudio-Windows-${{ github.sha }}
          path: |
            build/package/WorkbenchStudio-Windows-preview.zip
            build/package/WorkbenchStudio-Windows-preview.zip.sha256
            build/package/verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged preview
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Release notes missing: $notes" }
          gh release create $env:RELEASE_TAG --verify-tag --prerelease `
            --title "Workbench Studio $env:RELEASE_TAG" --notes-file $notes `
            build/package/WorkbenchStudio-Windows-preview.zip `
            build/package/WorkbenchStudio-Windows-preview.zip.sha256 `
            build/package/verification.json docs/QUICKSTART.txt
          if ($LASTEXITCODE) { throw 'Release publication failed' }
